<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simulador VR - Fogueira</title>
    <!-- A-Frame e Sistema de Partículas -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; user-select: none; }
        
        /* Tela de permissão de sensores (Obrigatório para Gyro no celular) */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        #start-btn {
            padding: 20px 40px; font-size: 24px; font-weight: bold;
            background: #ff5500; color: white; border: none; border-radius: 10px;
            cursor: pointer; box-shadow: 0 4px 10px rgba(255,85,0,0.5);
        }
        #start-btn:active { background: #cc4400; transform: scale(0.95); }

        /* Interface do celular (Botão de Esguichar) */
        #ui-layer {
            position: absolute; bottom: 30px; left: 0; width: 100%;
            display: none; justify-content: center; z-index: 1000; pointer-events: none;
        }
        #btn-esguichar {
            padding: 20px 50px; font-size: 22px; font-weight: bold;
            background: rgba(0, 150, 255, 0.7); color: white;
            border: 3px solid white; border-radius: 50px;
            pointer-events: auto; text-transform: uppercase;
        }
        #btn-esguichar:active { background: rgba(0, 200, 255, 0.9); }
    </style>
</head>
<body>

    <!-- TELA DE INÍCIO (Libera Sensores) -->
    <div id="start-screen">
        <h1 style="color: white; margin-bottom: 30px; text-align: center;">Treinamento VR</h1>
        <button id="start-btn">INICIAR SIMULADOR</button>
        <p style="color: #aaa; margin-top: 20px; font-size: 14px;">Requer permissão de movimento</p>
    </div>

    <!-- BOTÃO DE AÇÃO -->
    <div id="ui-layer">
        <button id="btn-esguichar">Esguichar Água</button>
    </div>

    <!-- CENA A-FRAME -->
    <a-scene embedded loading-screen="enabled: false">
        
        <!-- Texturas -->
        <a-assets>
            <img id="wood-tex" src="https://cdn.aframe.io/examples/ar/textures/wood.jpg" crossorigin="anonymous">
            <img id="ground-tex" src="https://cdn.aframe.io/examples/ar/textures/floor.png" crossorigin="anonymous">
        </a-assets>

        <!-- Ambiente Básico Escuro -->
        <a-sky color="#050505"></a-sky>
        <a-plane src="#ground-tex" rotation="-90 0 0" width="100" height="100" repeat="50 50" material="roughness: 1"></a-plane>

        <!-- Câmera e Mangueira (O jogador) -->
        <a-entity id="rig" position="0 1.6 0">
            <!-- Câmera com Raycaster para "Mirar" -->
            <a-camera id="camera" look-controls="magicWindowTrackingEnabled: true; touchEnabled: true" 
                      raycaster="objects: .alvo; far: 10" cursor="fuse: false; rayOrigin: mouse;">
                
                <!-- Mira Visual -->
                <a-entity position="0 0 -1" geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                          material="color: rgba(255, 255, 255, 0.5); shader: flat"></a-entity>

                <!-- Bico da Mangueira (Posicionado à direita e abaixo da visão) -->
                <a-cylinder position="0.3 -0.3 -0.5" rotation="90 0 0" radius="0.04" height="0.4" color="#cc0000">
                    <a-cylinder position="0 -0.2 0" radius="0.03" height="0.1" color="#222"></a-cylinder> <!-- Ponta -->
                    
                    <!-- Jato de Água (Desligado por padrão) -->
                    <!-- Usa partículas brancas/azuis com alta velocidade -->
                    <a-entity id="jato-agua" position="0 -0.3 0" rotation="-90 0 0"
                              particle-system="preset: dust; color: #ffffff, #88ccff; particleCount: 800; size: 0.8; velocity: 15; direction: -1; duration: -1"
                              visible="false"></a-entity>
                </a-cylinder>
            </a-camera>
        </a-entity>

        <!-- A FOGUEIRA -->
        <a-entity id="fogueira-container" position="0 0 -3" class="alvo">
            <!-- Lenha -->
            <a-cylinder src="#wood-tex" position="0 0.1 0" rotation="90 0 45" radius="0.1" height="1"></a-cylinder>
            <a-cylinder src="#wood-tex" position="0 0.1 0" rotation="90 0 -45" radius="0.1" height="1"></a-cylinder>
            <a-cylinder src="#wood-tex" position="0 0.2 0" rotation="0 0 90" radius="0.1" height="0.8"></a-cylinder>

            <!-- Fogo (Partículas) -->
            <a-entity id="fogo-particulas" position="0 0.4 0"
                      particle-system="preset: fire; color: #ff5500, #ffaa00; particleCount: 2000; size: 2; velocity: 2"></a-entity>
            
            <!-- Luz do Fogo -->
            <a-entity id="fogo-luz" position="0 1 0" light="type: point; color: #ff8800; intensity: 3; distance: 10; decay: 2"></a-entity>
        </a-entity>

    </a-scene>

    <script>
        // Lida com permissões de Giroscópio no iOS/Modern Browsers
        document.getElementById('start-btn').addEventListener('click', function() {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') iniciarSimulacao();
                        else alert('Permissão de movimento negada. O VR não funcionará corretamente.');
                    })
                    .catch(console.error);
            } else {
                iniciarSimulacao(); // Android e outros
            }
        });

        function iniciarSimulacao() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('ui-layer').style.display = 'flex';
        }

        // Lógica de Interação
        const btnEsguichar = document.getElementById('btn-esguichar');
        const jatoAgua = document.getElementById('jato-agua');
        const fogueiraContainer = document.getElementById('fogueira-container');
        const fogoParticulas = document.getElementById('fogo-particulas');
        const fogoLuz = document.getElementById('fogo-luz');
        const raycaster = document.querySelector('[raycaster]').components.raycaster;

        let esguichando = false;
        let vidaFogo = 100; // Porcentagem do fogo

        // Controles de Toque/Mouse
        const ligarAgua = (e) => { e.preventDefault(); esguichando = true; jatoAgua.setAttribute('visible', true); };
        const desligarAgua = (e) => { e.preventDefault(); esguichando = false; jatoAgua.setAttribute('visible', false); };

        btnEsguichar.addEventListener('mousedown', ligarAgua);
        btnEsguichar.addEventListener('touchstart', ligarAgua, {passive: false});
        window.addEventListener('mouseup', desligarAgua);
        window.addEventListener('touchend', desligarAgua);

        // Loop de verificação para apagar o fogo
        document.querySelector('a-scene').addEventListener('tick', function (time, deltaTime) {
            if (esguichando && vidaFogo > 0) {
                // Checa se a mira (raycaster) está batendo na fogueira (classe .alvo)
                const intersection = raycaster.intersections[0];
                if (intersection && intersection.object.el.id === 'fogueira-container') {
                    
                    // Diminui a vida do fogo
                    vidaFogo -= (0.02 * deltaTime); 
                    
                    // Atualiza o tamanho do fogo e da luz
                    let escala = Math.max(0, vidaFogo / 100);
                    fogoParticulas.setAttribute('particle-system', 'size', 2 * escala);
                    fogoLuz.setAttribute('light', 'intensity', 3 * escala);

                    // Desliga completamente quando chegar a 0
                    if (vidaFogo <= 0) {
                        fogoParticulas.setAttribute('visible', false);
                        fogoLuz.setAttribute('visible', false);
                        btnEsguichar.innerText = "FOGO APAGADO";
                        btnEsguichar.style.background = "#00aa00";
                    }
                }
            }
        });
    </script>
</body>
</html>
