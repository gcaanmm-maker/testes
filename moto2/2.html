<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MotoPro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617; 
            color: #e2e8f0; 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(circle at 50% -20%, #1e293b, #020617);
        }
        .glass { 
            background: rgba(30, 41, 59, 0.7); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
    </style>
</head>
<body class="p-4">

    <main class="glass w-full max-w-sm p-8 rounded-3xl shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-32 bg-blue-600/30 blur-3xl pointer-events-none"></div>

        <div class="relative z-10">
            <div class="text-center mb-8">
                <div class="mx-auto w-16 h-16 bg-blue-600 rounded-2xl flex items-center justify-center mb-4 shadow-[0_0_20px_rgba(37,99,235,0.4)]">
                    <i data-lucide="wrench" class="text-white" size="32"></i>
                </div>
                <h1 class="text-3xl font-black tracking-tighter text-white">MotoPro</h1>
                <p class="text-xs text-slate-400 mt-1">Gestão de Oficinas</p>
            </div>

            <form onsubmit="fazerLogin(event)" class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">E-mail de Acesso</label>
                    <div class="relative">
                        <input type="email" id="email" required placeholder="seu@email.com" class="w-full bg-black/50 text-white border border-white/10 rounded-xl p-3 pl-10 text-sm outline-none focus:border-blue-500 transition-colors">
                        <i data-lucide="mail" class="absolute left-3 top-3 text-slate-500" size="18"></i>
                    </div>
                </div>

                <div>
                    <label class="text-[10px] font-bold text-slate-400 uppercase block mb-1">Senha</label>
                    <div class="relative">
                        <input type="password" id="senha" required placeholder="••••••••" class="w-full bg-black/50 text-white border border-white/10 rounded-xl p-3 pl-10 text-sm outline-none focus:border-blue-500 transition-colors">
                        <i data-lucide="lock" class="absolute left-3 top-3 text-slate-500" size="18"></i>
                    </div>
                </div>

                <button type="submit" id="btn-login" class="w-full bg-blue-600 hover:bg-blue-500 p-3 rounded-xl font-black text-sm uppercase text-white mt-4 shadow-[0_4px_14px_0_rgba(37,99,235,0.39)] transition-all flex items-center justify-center gap-2">
                    <span>Entrar no Sistema</span>
                    <i data-lucide="arrow-right" size="16"></i>
                </button>
            </form>
        </div>
    </main>

    <script>
        lucide.createIcons();

        // COLOQUE A SUA URL E A SUA **ANON PUBLIC KEY** AQUI
        const SUPABASE_URL = 'https://ywtqcselaiygqhvmqqhh.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl3dHFjc2VsYWl5Z3Fodm1xcWhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkyMDUwMzgsImV4cCI6MjEwNDc4MTAzOH0.RPoBkH4Vl-1q49R2ItayYTls94h5JGxr4XpWHxLXyp8'; 
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) window.location.href = 'app2.html';
        };

        async function fazerLogin(event) {
            event.preventDefault(); 
            
            const btn = document.getElementById('btn-login');
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();

            if (!email || !senha) return;

            btn.innerHTML = `<i data-lucide="loader-2" class="animate-spin"></i> Autenticando...`;
            lucide.createIcons();
            btn.disabled = true;

            const { data: authData, error: authErr } = await supabaseClient.auth.signInWithPassword({
                email: email, password: senha
            });

            if (authErr) {
                btn.innerHTML = `<span>Entrar no Sistema</span><i data-lucide="arrow-right" size="16"></i>`;
                lucide.createIcons();
                btn.disabled = false;
                return alert("E-mail ou senha incorretos.");
            }

            const userId = authData.user.id;

            const { data: perfil, error: errPerfil } = await supabaseClient
                .from('perfis').select('ativo, oficina_id').eq('id', userId).single();

            if (errPerfil || !perfil) {
                await supabaseClient.auth.signOut();
                btn.disabled = false;
                return alert("Erro ao carregar dados do perfil. Contate o suporte.");
            }

            if (perfil.ativo === false) {
                await supabaseClient.auth.signOut();
                btn.innerHTML = `<span>Entrar no Sistema</span><i data-lucide="arrow-right" size="16"></i>`;
                lucide.createIcons();
                btn.disabled = false;
                return alert("⛔ ACESSO BLOQUEADO: Sua licença está suspensa.");
            }

            if (perfil.oficina_id !== userId) {
                const { data: oficinaPai } = await supabaseClient
                    .from('perfis').select('ativo').eq('id', perfil.oficina_id).single();

                if (oficinaPai && oficinaPai.ativo === false) {
                    await supabaseClient.auth.signOut();
                    btn.innerHTML = `<span>Entrar no Sistema</span><i data-lucide="arrow-right" size="16"></i>`;
                    lucide.createIcons();
                    btn.disabled = false;
                    return alert("⛔ ACESSO BLOQUEADO: A licença da oficina principal encontra-se suspensa.");
                }
            }

            window.location.href = 'app2.html';
        }
    </script>
</body>
</html>
