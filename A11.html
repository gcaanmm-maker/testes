<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Simulador - Fogo Perfeito</title>
    <!-- A-Frame e Partículas -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-particle-system-component@1.1.3/dist/aframe-particle-system-component.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: sans-serif; }
        
        #painel-acao {
            position: absolute; bottom: 5%; left: 0; width: 100%;
            display: flex; justify-content: center; z-index: 9999;
        }
        #btn-agua {
            padding: 20px 40px; font-size: 22px; font-weight: bold;
            background: #0088ff; color: white; border: 4px solid white;
            border-radius: 50px; cursor: pointer; user-select: none;
            box-shadow: 0px 5px 15px rgba(0,136,255,0.5);
            text-transform: uppercase;
        }
        #btn-agua:active { background: #0055aa; transform: scale(0.95); }
        
        #instrucao {
            position: absolute; top: 10%; left: 0; width: 100%;
            text-align: center; color: white; z-index: 9999; pointer-events: none;
            font-size: 18px; text-shadow: 2px 2px 4px black; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="instrucao">Ache o fogo, a mira vai ficar VERMELHA!</div>

    <div id="painel-acao">
        <button id="btn-agua">JOGAR ÁGUA</button>
    </div>

    <!-- CENA 3D -->
    <a-scene background="color: #222" loading-screen="enabled: false">
        
        <!-- CÂMERA -->
        <a-entity position="0 1.6 0">
            <a-camera look-controls="magicWindowTrackingEnabled: false">
                
                <!-- A MIRA -->
                <a-cursor id="mira" color="white" scale="1.5 1.5 1.5" raycaster="objects: .alvo"></a-cursor>

                <!-- MANGUEIRA E JATO -->
                <a-entity position="0.3 -0.5 -0.8">
                    <a-cylinder rotation="90 0 0" radius="0.05" height="0.4" color="#ff0000"></a-cylinder>
                    <a-entity id="jato-agua" visible="false">
                        <a-cylinder position="0 0 -2.5" rotation="90 0 0" radius="0.03" height="5" color="#00ffff" opacity="0.6"></a-cylinder>
                        <a-entity position="0 0 -0.2" particle-system="preset: snow; color: #ffffff, #00ffff; particleCount: 500; size: 0.5; velocity: 20; direction: -1" rotation="-90 0 0"></a-entity>
                    </a-entity>
                </a-entity>
            </a-camera>
        </a-entity>

        <!-- A SOLUÇÃO: material="visible: false" deixa a caixa clicável mas não interfere nos gráficos do fogo! -->
        <a-box id="hitbox-fogo" class="alvo" position="0 0.5 -4" scale="2 2 2" material="visible: false"></a-box>

        <!-- VISUAL DO FOGO -->
        <a-entity id="visual-fogo" position="0 0.5 -4">
            <a-cylinder position="0 -0.4 0" rotation="90 0 45" radius="0.1" height="1.2" color="#553311"></a-cylinder>
            <a-cylinder position="0 -0.4 0" rotation="90 0 -45" radius="0.1" height="1.2" color="#442200"></a-cylinder>
            <a-sphere position="0 0.2 0" radius="0.5" color="#ff4400" material="emissive: #ff4400; emissiveIntensity: 2; opacity: 0.8"></a-sphere>
            <a-entity position="0 0.2 0" particle-system="preset: fire; color: #ff0000, #ffaa00; particleCount: 1000; size: 2; velocity: 1"></a-entity>
            <a-entity light="type: point; color: #ff6600; intensity: 3; distance: 8"></a-entity>
        </a-entity>

        <!-- CHÃO -->
        <a-plane rotation="-90 0 0" width="20" height="20" color="#333"></a-plane>

    </a-scene>

    <script>
        const btnAgua = document.getElementById('btn-agua');
        const jatoAgua = document.getElementById('jato-agua');
        const visualFogo = document.getElementById('visual-fogo');
        const hitboxFogo = document.getElementById('hitbox-fogo');
        const mira = document.getElementById('mira');
        const instrucao = document.getElementById('instrucao');

        let jogandoAgua = false;
        let mirandoNoFogo = false;
        let tamanhoFogo = 1.0;

        // SISTEMA DE MIRA INTELIGENTE
        hitboxFogo.addEventListener('mouseenter', () => {
            mirandoNoFogo = true;
            mira.setAttribute('color', '#ff0000'); 
            if(tamanhoFogo > 0) instrucao.innerText = "ALVO NA MIRA! Jogue água!";
        });

        hitboxFogo.addEventListener('mouseleave', () => {
            mirandoNoFogo = false;
            mira.setAttribute('color', 'white'); 
            if(tamanhoFogo > 0) instrucao.innerText = "Mire no fogo!";
        });

        // BOTÃO DE ÁGUA
        const ligarAgua = (e) => {
            e.preventDefault();
            jogandoAgua = true;
            btnAgua.innerText = "ESGUICHANDO!";
            btnAgua.style.background = "#00ffff";
            btnAgua.style.color = "#000";
            jatoAgua.setAttribute('visible', 'true');
        };

        const desligarAgua = (e) => {
            e.preventDefault();
            jogandoAgua = false;
            btnAgua.innerText = "JOGAR ÁGUA";
            btnAgua.style.background = "#0088ff";
            btnAgua.style.color = "#fff";
            jatoAgua.setAttribute('visible', 'false');
        };

        btnAgua.addEventListener('mousedown', ligarAgua);
        btnAgua.addEventListener('touchstart', ligarAgua, {passive: false});
        window.addEventListener('mouseup', desligarAgua);
        window.addEventListener('touchend', desligarAgua);

        // LÓGICA DE APAGAR O FOGO
        document.querySelector('a-scene').addEventListener('tick', function () {
            if (jogandoAgua && mirandoNoFogo && tamanhoFogo > 0) {
                
                instrucao.innerText = "Apagando o fogo...";
                instrucao.style.color = "#00ffff";

                tamanhoFogo -= 0.005; 
                visualFogo.setAttribute('scale', `${tamanhoFogo} ${tamanhoFogo} ${tamanhoFogo}`);
                
                if (tamanhoFogo <= 0) {
                    visualFogo.setAttribute('visible', 'false');
                    hitboxFogo.classList.remove('alvo'); 
                    mira.setAttribute('color', 'white'); 
                    
                    instrucao.innerText = "INCÊNDIO CONTROLADO!";
                    instrucao.style.color = "#00ff00";
                    
                    btnAgua.innerText = "FOGO APAGADO";
                    btnAgua.style.background = "#00cc00";
                    btnAgua.style.color = "white";
                }
            }
        });
    </script>
</body>
</html>
